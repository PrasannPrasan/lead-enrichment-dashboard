services:
  db:
    image: postgres:16-alpine
    container_name: lead-enrichment-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lead_enrichment
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - lead-enrichment-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lead_enrichment"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lead-enrichment-postgres:
